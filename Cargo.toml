[package]
name = "game-job-dlq"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "game-job-dlq"
path = "src/queue_worker.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
